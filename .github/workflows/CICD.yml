name : capstone server cics with gradle

on:
  push:
    branches: ["main"]

jobs:
  deploy-producer-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      #repo code -> actions server 다운로드
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      # actions 서버에 java 17 설치

      - name: Build kafka producer
        run: |
          cd kafka-producer
          chmod +x gradlew
          ./gradlew bootJar
      #kafka-roducer 폴더에서 jar파일 빌드
      # bootjar 실행가능한 jar 파일 생성

      - name : Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name : Build & push producer image
        uses: docker/build-push-action@v4
        with:
          context: ./kafka-producer
          #Dockerfile이 있는 폴더로 가서
          push: true
          #빌드 후 Docker hub에 자동 업로드
          tags: ${{secrets.DOCKER_USERNAME}}/producer:latest
          #dockerfile 읽고 -> 이미지 빌드 후 ->docker hub에 push

      - name: Deploy producer server to ncp
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          script: |
            mkdir -p /app/producer
            # /app/producer
            cat > /app/producer/application.yml << 'EOF'
            ${{ secrets.APPLICATION_YML_PRODUCER }}
            EOF
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/producer:latest
            docker stop producer || true
            docker rm producer || true
            docker run -d \
              --name producer \
              --restart always \
              -p 9090:9090 \
              -e SPRING_CONFIG_LOCATION=/config/application.yml \
              -v /app/producer:/config \
              ${{ secrets.DOCKER_USERNAME }}/producer:latest
    #docker hub에서 최신 이미지 다운로드 # 컨테이너 이름 정하고   # 재부팅 or 컨테이너 죽을 때 자동 재시작
    #ncp 9090 -> 컨테이너 9090  #컨테이너 에서의 환경변수 설정으로 위치 알려줌
    # 볼륨 마운트 ncp의 /app/producer -> 컨테이너 /config # 실행한 이미지
  deploy-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Consumer
        run: |
          cd kafka-consumer
          chmod +x gradlew
          ./gradlew bootJar

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Consumer Image
        uses: docker/build-push-action@v4
        with:
          context: ./kafka-consumer
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/consumer:latest

      - name: Deploy Consumer to NCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          script: |
            mkdir -p /app/consumer
             cat > /app/consumer/application.yml << 'EOF'
            ${{ secrets.APPLICATION_YML_CONSUMER }}
            EOF
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/consumer:latest
            docker stop consumer || true
            docker rm consumer || true
            docker run -d \
              --name consumer \
              --restart always \
              -p 9000:9000 \
              -e SPRING_CONFIG_LOCATION=/config/application.yml \
              -v /app/consumer:/config \
              ${{ secrets.DOCKER_USERNAME }}/consumer:latest      
