name: Deploy to NCP

on:
  push:
    branches: [ main ]

jobs:
  deploy-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Producer
        run: |
          cd kafka-producer
          chmod +x gradlew
          ./gradlew bootJar

      - name: Create producer directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: mkdir -p /app/producer

      - name: Create Producer application.yml
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: |
            cat > /app/producer/application.yml << 'ENDOFFILE'
            ${{ secrets.APPLICATION_YML_PRODUCER }}
            ENDOFFILE

      - name: Copy Producer jar
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          source: "kafka-producer/build/libs/*.jar"
          target: "/app/producer/"
          strip_components: 3

      - name: Restart Producer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: |
            pkill -f producer || true
            sleep 2
            nohup java -jar /app/producer/*.jar \
              --spring.config.location=/app/producer/application.yml \
              > /app/producer/producer.log 2>&1 &

  deploy-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Consumer
        run: |
          cd kafka-consumer
          chmod +x gradlew
          ./gradlew bootJar

      - name: Create consumer directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: mkdir -p /app/consumer

      - name: Create Consumer application.yml
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: |
            cat > /app/consumer/application.yml << 'ENDOFFILE'
            ${{ secrets.APPLICATION_YML_CONSUMER }}
            ENDOFFILE

      - name: Copy Consumer jar
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          source: "kafka-consumer/build/libs/*.jar"
          target: "/app/consumer/"
          strip_components: 3

      - name: Restart Consumer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_PEM_KEY }}
          script: |
            pkill -f consumer || true
            sleep 2
            nohup java -jar /app/consumer/*.jar \
              --spring.config.location=/app/consumer/application.yml \
              > /app/consumer/consumer.log 2>&1 &