global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'kafka-consumer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['223.130.139.89:9000'] # 컨슈머 포트

  - job_name: 'kafka-producer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['223.130.139.89:9001'] # 프로듀서 포트 (기본값 가정)